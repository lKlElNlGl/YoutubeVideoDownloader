name: IconLab alpha shape investigation
on:
  push:
    branches: ['feature/icon-lab']
    paths: ['.github/workflows/iconlab-alpha-study.yml']
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python -m scripts.iconlab_alpha_study
