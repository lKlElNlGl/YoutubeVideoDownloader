name: Icon Lab small APK

on:
  push:
    branches: ['feature/icon-lab']
    paths:
      - '.github/workflows/iconlab.yml'
      - 'iconlab/**'
      - 'scripts/test_iconlab_generate.py'
      - 'settings.gradle'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iconlab:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install image tooling
        run: python3 -m pip install --user Pillow
      - name: Test exact user PNG source hashes and aliases
        run: python3 -m unittest scripts/test_iconlab_generate.py
      - name: Build small standalone APK
        run: gradle --no-daemon :iconlab:assembleDebug
      - name: Verify package and small size
        run: |
          set -euo pipefail
          apk=iconlab/build/outputs/apk/debug/iconlab-debug.apk
          test -s "$apk"
          test "$(stat -c '%s' "$apk")" -lt 5000000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.lklelnlgl.iconlab'"
      - name: Verify both icon assets are packaged
        run: |
          set -euo pipefail
          apk=iconlab/build/outputs/apk/debug/iconlab-debug.apk
          unzip -Z -1 "$apk" > /tmp/iconlab_apk_entries.txt
          grep -F 'lab_user_a_192.png' /tmp/iconlab_apk_entries.txt
          grep -F 'lab_user_b_large.png' /tmp/iconlab_apk_entries.txt
      - name: Publish separate prerelease
        run: |
          set -euo pipefail
          apk=iconlab/build/outputs/apk/debug/iconlab-debug.apk
          mkdir -p dist
          cp "$apk" dist/IconLab-v0.5.11.apk
          tag=iconlab-v0.5.11
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/IconLab-v0.5.11.apk --clobber
          else
            gh release create "$tag" dist/IconLab-v0.5.11.apk \
              --target "$GITHUB_SHA" --title "Icon Lab v0.5.11" \
              --notes "Two user supplied original PNG files, 77.png 192x189 and 555.png 1035x1019, used unchanged and directly as drawable-nodpi icons. Labels _A_192px and _B_Большая. No resizing, masks, adaptive icons or home shortcuts; main downloader unchanged." \
              --prerelease --latest=false
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: IconLab-v0.5.11
          path: iconlab/build/outputs/apk/debug/iconlab-debug.apk
          if-no-files-found: error
