name: Icon Lab small APK

on:
  push:
    branches: ['feature/icon-lab']
    paths:
      - '.github/workflows/iconlab.yml'
      - 'iconlab/**'
      - 'scripts/generate_iconlab_icons.py'
      - 'scripts/iconlab_reference_v032.py'
      - 'scripts/iconlab_legacy_v055.py'
      - 'scripts/test_iconlab_generate.py'
      - 'settings.gradle'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iconlab:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install image tooling
        run: python3 -m pip install --user Pillow
      - name: Test original C2 versus approved art with C2 alpha-only cleanup
        run: python3 -m unittest scripts/test_iconlab_generate.py
      - name: Build small standalone APK
        run: gradle --no-daemon :iconlab:assembleDebug
      - name: Verify package and small size
        run: |
          set -euo pipefail
          apk=iconlab/build/outputs/apk/debug/iconlab-debug.apk
          test -s "$apk"
          test "$(stat -c '%s' "$apk")" -lt 5000000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.lklelnlgl.iconlab'"
      - name: Publish separate prerelease
        run: |
          set -euo pipefail
          apk=iconlab/build/outputs/apk/debug/iconlab-debug.apk
          mkdir -p dist
          cp "$apk" dist/IconLab-v0.5.7.apk
          tag=iconlab-v0.5.7
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/IconLab-v0.5.7.apk --clobber
          else
            gh release create "$tag" dist/IconLab-v0.5.7.apk \
              --target "$GITHUB_SHA" --title "Icon Lab v0.5.7" \
              --notes "Old Clean C2 remains byte-identical to v0.3.2. New approved artwork receives the same original C2 alpha contour cleanup, without recoloring any source RGB, while remaining in the legacy 192px xxxhdpi icon format. No adaptive background or main app changes." \
              --prerelease --latest=false
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: IconLab-v0.5.7
          path: iconlab/build/outputs/apk/debug/iconlab-debug.apk
          if-no-files-found: error
