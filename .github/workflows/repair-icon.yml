name: Temporary icon integrity recovery
on:
  push:
    branches: [feature/premium-fixes-036]
    paths: [.github/workflows/repair-icon.yml]
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover expected content and emit validated base64
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib
          from pathlib import Path
          p=Path('app/src/main/res/drawable-nodpi/ic_launcher_reference.webp')
          raw=p.read_bytes()
          if len(raw)!=5335: raise SystemExit(f'Unexpected size: {len(raw)}')
          incomplete=base64.b64encode(raw).decode('ascii')[:-1]
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          target='4393134d5e550505a6b09a453661ead2649bddab'
          for position in range(len(incomplete)):
              before=incomplete[:position]
              after=incomplete[position:]
              for c in alphabet:
                  try: data=base64.b64decode(before+c+after,validate=True)
                  except Exception: continue
                  if len(data)!=5336: continue
                  sha=hashlib.sha1(b'blob 5336\\x00'+data).hexdigest()
                  if sha==target:
                      print('RECOVERED_SHA='+sha,flush=True)
                      print('APPROVED_ICON_BASE64='+base64.b64encode(data).decode('ascii'),flush=True)
                      raise SystemExit(0)
          raise SystemExit('Could not restore icon; no binary artifact will be used')
          
          PY
