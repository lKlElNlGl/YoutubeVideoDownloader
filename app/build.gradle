plugins { id 'com.android.application' }
android {
    namespace 'com.lklengl.youtubevideodownloader'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lklengl.youtubevideodownloader'
        minSdk 29
        targetSdk 35
        versionCode = (project.findProperty('appVersionCode') ?: '3000').toString().toInteger()
        versionName = (project.findProperty('appVersionName') ?: '0.3.0').toString()
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'androidx.work:work-runtime:2.12.0'
}
