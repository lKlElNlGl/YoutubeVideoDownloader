plugins { id 'com.android.application' }

android {
    namespace 'com.lklelnlgl.iconlab'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lklelnlgl.iconlab'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('generateIconLabIcons', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/generate_iconlab_icons.py'
}
tasks.named('preBuild') { dependsOn tasks.named('generateIconLabIcons') }
